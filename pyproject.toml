[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandaviz"
version = "0.1.0"
description = "A minimal, pandas-first visualization library built on matplotlib."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pandaviz"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda"
version = "0.1.0"
description = "A minimal, pandas-first visualization library for exploratory data analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Alex Casella" }]
dependencies = [
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
